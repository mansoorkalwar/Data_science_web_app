name: Apply navbar visual fixes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  navbar-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply navbar-only CSS overrides
        shell: python
        run: |
          from pathlib import Path

          path = Path("static/css/style.css")
          css = path.read_text(encoding="utf-8")
          marker = "/* Scroll-aware navbar bottom border and navigation dividers */"

          if marker not in css:
              css += r'''

          /* Scroll-aware navbar bottom border and navigation dividers */
          .navbar-dots {
              position: sticky;
              top: 78px;
              z-index: 1499;
              opacity: 1;
              transform: translateY(0);
              pointer-events: none;
          }

          .nav-link + .nav-link::before {
              content: "";
              position: absolute;
              left: 0;
              top: 50%;
              width: 0;
              height: 22px;
              border-left: 1px solid rgba(112, 109, 102, .42);
              transform: translateY(-50%);
              z-index: 2;
          }

          @supports (animation-timeline: scroll(root)) {
              @keyframes navbarDotsReveal {
                  0% {
                      opacity: 0;
                      transform: translateY(-4px);
                  }
                  100% {
                      opacity: 1;
                      transform: translateY(0);
                  }
              }

              .navbar-dots {
                  opacity: 0;
                  animation: navbarDotsReveal linear both;
                  animation-timeline: scroll(root);
                  animation-range: 0 140px;
              }
          }

          @media (max-width: 800px) {
              .navbar-dots {
                  top: 70px;
              }
          }

          @media (prefers-reduced-motion: reduce) {
              .navbar-dots {
                  opacity: 1;
                  animation: none !important;
                  transform: none;
              }
          }
          '''
              path.write_text(css, encoding="utf-8")

      - name: Commit CSS and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/css/style.css .github/workflows/navbar-fix.yml
          git rm .github/workflows/navbar-fix.yml
          git commit -m "Enhance navbar scroll border and dividers"
          git push